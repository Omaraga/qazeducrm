# QazEduCRM Nginx Configuration

# Telegram Webhook server (IP-based with self-signed certificate)
server {
    listen 443 ssl;
    server_name 51.178.43.37;

    # Self-signed certificate for Telegram webhook
    ssl_certificate /etc/nginx/ssl/telegram/telegram_public.pem;
    ssl_certificate_key /etc/nginx/ssl/telegram/telegram_private.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html/web;
    index index.php;

    # Only allow Telegram webhook endpoint
    location = /telegram-webhook {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    # Deny everything else
    location / {
        return 403;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.qazaq.education;

    root /var/www/html/web;
    index index.php;

    charset utf-8;
    client_max_body_size 50M;

    # Let's Encrypt ACME challenge - MUST be before hidden files block
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect all HTTP to HTTPS (except ACME challenge)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.qazaq.education;

    # SSL certificates
    ssl_certificate /etc/nginx/ssl/live/crm.qazaq.education/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/crm.qazaq.education/privkey.pem;

    # SSL configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    root /var/www/html/web;
    index index.php;

    charset utf-8;
    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml;

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Yii2 pretty URLs
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Evolution API proxy (WhatsApp)
    location /whatsapp/ {
        proxy_pass http://evolution-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # Evolution API Swagger docs
    location /whatsapp/docs {
        proxy_pass http://evolution-api:8080/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Deny access to hidden files (except .well-known)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~* (composer\.json|composer\.lock|\.env|\.git) {
        deny all;
    }

    # Logs
    access_log /var/log/nginx/qazeducrm_access.log;
    error_log /var/log/nginx/qazeducrm_error.log;
}
